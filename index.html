<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بحث المصاعد</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #0d0d0d;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .logo {
      max-width: 160px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 12px rgba(201, 162, 39, 0.3));
    }
    h1 {
      color: #c9a227;
      margin-bottom: 30px;
      font-size: 26px;
      font-weight: 600;
    }
    .search-box {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    input {
      padding: 14px 18px;
      font-size: 18px;
      border-radius: 10px;
      border: 2px solid #333;
      background: #1a1a1a;
      color: #fff;
      width: 260px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #c9a227; }
    button {
      padding: 14px 32px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #c9a227;
      color: #000;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #e0b83a; }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #c9a227;
      border-radius: 14px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      text-align: right;
      animation: fadeIn 0.3s ease;
    }
    .card p {
      margin: 14px 0;
      font-size: 17px;
      line-height: 1.5;
    }
    .label {
      color: #c9a227;
      font-weight: bold;
      display: inline-block;
      min-width: 150px;
    }
    .error {
      color: #e74c3c;
      font-size: 17px;
      margin-top: 10px;
    }
    .loading {
      color: #aaa;
      font-size: 16px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="Logo" class="logo">

  <h1>بحث عن مصعد</h1>

  <div class="search-box">
    <input type="text" id="elevatorNum" placeholder="رقم المصعد" autocomplete="off">
    <button id="searchBtn" onclick="search()">بحث</button>
  </div>

  <div id="result"></div>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWu3g_9DZHyPcZxr8A6A9CR70e-dH3E33_ONR3LdV-b9sQGL0vzZgNOetRbPBwOOrs0w39icEeuNSw/pub?gid=115150974&single=true&output=csv';

    function parseCSV(text) {
      const rows = [];
      let current = '';
      let inQuotes = false;
      let row = [];

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && inQuotes && next === '"') {
          current += '"';
          i++;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (current || row.length) {
            row.push(current.trim());
            rows.push(row);
            row = [];
            current = '';
          }
          if (char === '\r' && next === '\n') i++;
        } else {
          current += char;
        }
      }
      if (current || row.length) {
        row.push(current.trim());
        rows.push(row);
      }
      return rows;
    }

    async function search() {
      const num = document.getElementById('elevatorNum').value.trim();
      const resultDiv = document.getElementById('result');
      const btn = document.getElementById('searchBtn');

      if (!num) {
        resultDiv.innerHTML = '<p class="error">اكتب رقم المصعد أولاً</p>';
        return;
      }

      btn.disabled = true;
      resultDiv.innerHTML = '<p class="loading">جاري البحث...</p>';

      try {
        const response = await fetch(SHEET_CSV_URL + '&_=' + Date.now());
        if (!response.ok) throw new Error('فشل تحميل البيانات من الشيت');

        const text = await response.text();
        const rows = parseCSV(text);

        if (rows.length < 2) {
          resultDiv.innerHTML = '<p class="error">الشيت فاضي أو مش منظم</p>';
          return;
        }

        const headers = rows[0].map(h => h.trim());

        // أعمدة محددة بالاسم الدقيق
        const elevCol   = headers.indexOf('رقم المصعد');
        const clientCol = headers.indexOf('اسم العميل');
        const endCol    = headers.indexOf('تاريخ انتهاء العقد');
        const maintCol  = headers.indexOf('صلاحية الصيانة');

        if (elevCol === -1) {
          resultDiv.innerHTML = '<p class="error">عمود "رقم المصعد" مش موجود</p>';
          return;
        }

        let found = null;
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (String(row[elevCol] || '').trim() === num) {
            found = {
              client: clientCol > -1 ? (row[clientCol] || '-') : '-',
              end:    endCol > -1    ? (row[endCol] || '-')    : '-',
              maint:  maintCol > -1  ? (row[maintCol] || '-')  : '-'
            };
            break;
          }
        }

        if (found) {
          resultDiv.innerHTML = `
            <div class="card">
              <p><span class="label">اسم العميل:</span> ${found.client}</p>
              <p><span class="label">تاريخ انتهاء العقد:</span> ${found.end}</p>
              <p><span class="label">صلاحية الصيانة:</span> ${found.maint}</p>
            </div>
          `;
        } else {
          resultDiv.innerHTML = '<p class="error">رقم المصعد غير موجود</p>';
        }

      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<p class="error">حصل خطأ: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('elevatorNum').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') search();
    });
  </script>
</body>
</html>
